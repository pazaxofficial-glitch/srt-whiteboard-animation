    <!-- crest (filled red later) -->
    <path d="M610 300 C 640 170, 760 120, 880 130 C 960 138, 1010 170, 1040 215 C 990 200, 930 205, 890 230 C 850 205, 790 200, 740 225 C 700 245, 660 270, 610 300 Z" fill="#D9452B"/>
    <path d="M660 270 C 700 215, 760 185, 830 180"/>
