    <path d="M560 470 C 560 330, 660 245, 800 245 C 940 245, 1040 330, 1040 470 L 1040 640 C 1040 680, 1010 700, 980 700 L 900 700 C 880 700, 870 685, 870 665 L 870 520 C 870 500, 850 485, 830 485 L 770 485 C 750 485, 730 500, 730 520 L 730 665 C 730 685, 720 700, 700 700 L 620 700 C 590 700, 560 680, 560 640 Z" fill="#E8B04A"/>
